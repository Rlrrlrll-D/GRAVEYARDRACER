    <g transform="translate(630,42)" stroke="#7d7466" stroke-width="3" fill="none" stroke-linecap="round"><line y1="10" y2="-8"/><line y1="-4" x2="-7" y2="-13"/><line y1="-1" x2="7" y2="-10"/></g>
    <text x="648" y="47" fill="#c9cede" font-size="13">DeadTree ×6 (декор)</text>

    <ellipse cx="822" cy="42" rx="13" ry="8" fill="none" stroke="#c05555" stroke-width="1.5" stroke-dasharray="5 4"/>
