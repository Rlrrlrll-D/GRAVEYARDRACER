<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="nightGround" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2e3345"/>
      <stop offset="55%" stop-color="#232738"/>
      <stop offset="100%" stop-color="#181b28"/>
    </radialGradient>
    <radialGradient id="hill" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#363c54"/>
      <stop offset="100%" stop-color="#232738" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8fa3c4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8fa3c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dangerZone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c05555" stop-opacity="0.13"/>
      <stop offset="80%" stop-color="#c05555" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c05555" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="980" fill="url(#nightGround)"/>

  <!-- ===== КООРДИНАТНАЯ СЕТКА (1 клетка = 50 studs = 125 px; центр 600,450 = (0,0)) ===== -->
  <g stroke="#3a4058" stroke-width="1" opacity="0.55">
    <line x1="100" y1="75"  x2="1100" y2="75"/>
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="325" x2="1100" y2="325"/>
    <line x1="100" y1="450" x2="1100" y2="450"/>
    <line x1="100" y1="575" x2="1100" y2="575"/>
    <line x1="100" y1="700" x2="1100" y2="700"/>
    <line x1="100" y1="825" x2="1100" y2="825"/>
    <line x1="100"  y1="75" x2="100"  y2="825"/>
    <line x1="225"  y1="75" x2="225"  y2="825"/>
    <line x1="350"  y1="75" x2="350"  y2="825"/>
    <line x1="475"  y1="75" x2="475"  y2="825"/>
    <line x1="600"  y1="75" x2="600"  y2="825"/>
    <line x1="725"  y1="75" x2="725"  y2="825"/>
    <line x1="850"  y1="75" x2="850"  y2="825"/>
    <line x1="975"  y1="75" x2="975"  y2="825"/>
    <line x1="1100" y1="75" x2="1100" y2="825"/>
  </g>
  <!-- оси через центр -->
  <line x1="100" y1="450" x2="1100" y2="450" stroke="#4d5578" stroke-width="1.6" opacity="0.8"/>
  <line x1="600" y1="75"  x2="600"  y2="825" stroke="#4d5578" stroke-width="1.6" opacity="0.8"/>
  <!-- подписи сетки в studs -->
  <g fill="#5d6584" font-size="12" text-anchor="middle">
    <text x="100" y="845">X −200</text><text x="225" y="845">−150</text>
    <text x="350" y="845">−100</text><text x="475" y="845">−50</text>
    <text x="600" y="845">0</text><text x="725" y="845">+50</text>
    <text x="850" y="845">+100</text><text x="975" y="845">+150</text>
    <text x="1100" y="845">+200</text>
  </g>
  <g fill="#5d6584" font-size="12" text-anchor="end">
    <text x="94" y="79">Z −150</text><text x="94" y="204">−100</text>
    <text x="94" y="329">−50</text><text x="94" y="454">0</text>
    <text x="94" y="579">+50</text><text x="94" y="704">+100</text>
    <text x="94" y="829">+150</text>
  </g>

  <!-- ХОЛМЫ -->
  <ellipse cx="170" cy="170" rx="180" ry="105" fill="url(#hill)"/>
  <ellipse cx="1050" cy="730" rx="210" ry="120" fill="url(#hill)"/>
  <ellipse cx="190" cy="770" rx="190" ry="100" fill="url(#hill)"/>
  <ellipse cx="1040" cy="470" rx="150" ry="90" fill="url(#hill)"/>

  <!-- ЗОНЫ РИСКА (кластер могил в досягаемости от Hazard'ов) -->
  <ellipse cx="390" cy="640" rx="230" ry="160" fill="url(#dangerZone)"/>
  <ellipse cx="390" cy="640" rx="230" ry="160" fill="none" stroke="#c05555" stroke-width="1.5" stroke-dasharray="8 7" opacity="0.55"/>
  <text x="390" y="500" fill="#d98a8a" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">ЗОНА РИСКА А · нижняя петля</text>
  <text x="390" y="518" fill="#b07070" font-size="12" text-anchor="middle" font-style="italic">4 hazard'а + 5 могил: авария → зомби догоняют</text>

  <ellipse cx="880" cy="235" rx="200" ry="135" fill="url(#dangerZone)" opacity="0.6"/>
  <ellipse cx="880" cy="235" rx="200" ry="135" fill="none" stroke="#c05555" stroke-width="1.5" stroke-dasharray="8 7" opacity="0.4"/>
  <text x="880" y="90" fill="#d98a8a" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">ЗОНА РИСКА Б · верхняя петля</text>
  <text x="880" y="108" fill="#b07070" font-size="12" text-anchor="middle" font-style="italic">2 hazard'а, могилы дальше от дороги</text>

  <!-- ТУМАН -->
  <ellipse cx="430" cy="650" rx="150" ry="80" fill="url(#fog)"/>
  <ellipse cx="820" cy="265" rx="140" ry="70" fill="url(#fog)"/>

