    <g transform="translate(430,760)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="0" y="30" fill="#a8dcb0" font-size="11" text-anchor="middle">G3 (−68, +124)</text></g>
    <g transform="translate(510,610)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="-2" y="-19" fill="#a8dcb0" font-size="11" text-anchor="middle">G4 (−36, +64)</text></g>
    <g transform="translate(700,690)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="0" y="30" fill="#a8dcb0" font-size="11" text-anchor="middle">G5 (+40, +96)</text></g>
    <g transform="translate(700,300)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="0" y="-19" fill="#a8dcb0" font-size="11" text-anchor="middle">G6 (+40, −60)</text></g>
    <g transform="translate(760,140)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="0" y="-19" fill="#a8dcb0" font-size="11" text-anchor="middle">G7 (+64, −124)</text></g>
    <g transform="translate(920,330)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="42" y="4" fill="#a8dcb0" font-size="11" text-anchor="middle">G8 (+128, −48)</text></g>
    <g transform="translate(1030,190)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="0" y="-19" fill="#a8dcb0" font-size="11" text-anchor="middle">G9 (+172, −104)</text></g>
    <g transform="translate(500,340)"><g fill="none" stroke="#9fd8a8" stroke-width="4" stroke-linecap="round"><line y1="-12" y2="12"/><line x1="-8" y1="-4" x2="8" y2="-4"/></g><text x="0" y="-19" fill="#a8dcb0" font-size="11" text-anchor="middle">G10 (−40, −44)</text></g>
  </g>

