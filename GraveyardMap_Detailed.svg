  <g>
    <g transform="translate(390,440)"><rect x="-9" y="-12" width="18" height="24" rx="7" fill="#d98a8a" stroke="#a85f5f" stroke-width="2"/><text x="0" y="-19" fill="#e8a0a0" font-size="11" text-anchor="middle">H1 (−84, −4)</text></g>
    <g transform="translate(260,600)"><rect x="-9" y="-12" width="18" height="24" rx="7" fill="#d98a8a" stroke="#a85f5f" stroke-width="2"/><text x="0" y="-19" fill="#e8a0a0" font-size="11" text-anchor="middle">H2 (−136, +60)</text></g>
    <g transform="translate(475,738)"><rect x="-9" y="-12" width="18" height="24" rx="7" fill="#d98a8a" stroke="#a85f5f" stroke-width="2"/><text x="0" y="32" fill="#e8a0a0" font-size="11" text-anchor="middle">H3 (−50, +115)</text></g>
