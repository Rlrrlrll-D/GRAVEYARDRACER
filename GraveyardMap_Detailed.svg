    <g transform="translate(968,285)"><circle r="24" fill="url(#lampGlow)"/><circle r="5" fill="#ffd98a"/><text x="52" y="4" fill="#ffd98a" font-size="11" text-anchor="middle">L5 (+147, −66)</text></g>
