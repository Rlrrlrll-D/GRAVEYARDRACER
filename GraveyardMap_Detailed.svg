    <g transform="translate(675,250)"><rect x="-9" y="-12" width="18" height="24" rx="7" fill="#d98a8a" stroke="#a85f5f" stroke-width="2"/><text x="0" y="-19" fill="#e8a0a0" font-size="11" text-anchor="middle">H6 (+30, −80)</text></g>
    <g transform="translate(915,285)"><rect x="-9" y="-12" width="18" height="24" rx="7" fill="#d98a8a" stroke="#a85f5f" stroke-width="2"/><text x="0" y="32" fill="#e8a0a0" font-size="11" text-anchor="middle">H7 (+126, −66)</text></g>
  </g>

